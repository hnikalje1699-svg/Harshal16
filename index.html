<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e8, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 360px;
    }

    h1 {
      color: #ff4d88;
      margin-bottom: 30px;
      font-size: 1.6em;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 12px 26px;
      font-size: 1.1em;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background-color: #ff4d88;
      color: white;
    }

    #yes:active {
      transform: scale(1.05);
      background-color: #ff1f6d;
    }

    #no {
      background-color: #ffe3ef;
      color: #ff4d88;
      position: absolute;
      left: 55%;
      top: 0;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    #result img {
      width: 100%;
      border-radius: 15px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💘 Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No 😢</button>
    </div>

    <div id="result">
      <h2>good choice 😏❤️</h2>
      <img src="good-choice.png" alt="Good choice meme">
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const result = document.getElementById("result");
    const buttons = document.querySelector(".buttons");

    function moveNo() {
      const maxX = buttons.offsetWidth - noBtn.offsetWidth;
      const maxY = buttons.offsetHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Mouse & mobile touch support
    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      result.style.display = "block";
    });
  </script>

</body>
</html>
